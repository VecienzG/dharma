<!doctype html>
<html lang="it" translate="no" class="light">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/dharma-logo.svg"
      data-rh="true"
    />
    <link rel="apple-touch-icon" href="/dharma-logo.svg" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#3B3B98" />
    <meta
      name="description"
      content="Dharma — Il tuo studio creativo, allineato."
    />
    <meta property="og:image" content="/dharma-logo.svg" />
    <meta
      property="og:description"
      content="Dharma — Il tuo studio creativo, allineato."
    />
    <meta property="og:title" content="Dharma" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/dharma-logo.svg" />

    <meta
      name="twitter:description"
      content="Dharma — Il tuo studio creativo, allineato."
    />
    <meta name="twitter:title" content="Dharma" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600&display=swap"
    />

    <title>Dharma</title>
    <!-- BEGIN: Twenty Config -->
    <script id="twenty-env-config">
      window._env_ = {
        // This will be overwritten
      };
    </script>
    <!-- END: Twenty Config -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector('meta[name=viewport]');

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>
    <style>
      :root {
        /* Dharma — initial paint background (before JS hydrates theme overrides) */
        --theme-dark-background-tertiary: #0f0f12;
        --theme-light-background-tertiary: #faf8f5;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: var(--theme-dark-background-tertiary);
        }
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: var(--theme-light-background-tertiary);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
